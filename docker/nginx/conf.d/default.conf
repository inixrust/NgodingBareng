server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    # DNS internal Docker. Alamat container php-fpm di-resolve ulang tiap 10 detik
    # (bukan sekali saat startup), supaya restart container "app" tidak bikin 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- Security header -----------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "0"                            always;

    # --- Berkas yang tidak perlu dicatat -------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; expires 30d; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Asset hasil build Vite: nama file sudah ber-hash, aman di-cache lama --
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- File upload dari disk "public" --------------------------------------
    # Dilayani langsung dari volume storage, tanpa lewat PHP.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- Routing Laravel -----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP -----------------------------------------------------------------
    # "internal" = hanya bisa dicapai lewat rewrite dari blok di atas,
    # sehingga /index.php tidak bisa diakses langsung dari luar.
    location = /index.php {
        internal;

        include fastcgi_params;

        # Pakai variabel agar hostname di-resolve saat request (lihat resolver di atas)
        set $php_upstream "app:9000";
        fastcgi_pass $php_upstream;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param HTTP_PROXY      "";

        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 60s;
        fastcgi_buffer_size  32k;
        fastcgi_buffers      16 16k;
    }

    # Tolak semua file .php lain (mis. sisa installer pihak ketiga)
    location ~ \.php$ {
        return 404;
    }

    # Tolak dotfile kecuali /.well-known (ACME, dsb.)
    location ~ /\.(?!well-known).* {
        deny  all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;
}
