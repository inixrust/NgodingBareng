; Override khusus development — menimpa zz-app.ini karena prefix "zzz-".

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 512M
max_execution_time = 0

; Kode di-bind-mount dari host, jadi OPcache harus mendeteksi perubahan file.
opcache.validate_timestamps = 1
; JANGAN diisi 0 di Docker Desktop Windows: nilai 0 memaksa stat() ke setiap file
; PHP pada SETIAP request, dan stat() lewat bind mount Windows sangat mahal
; (ribuan file di vendor/ => request bisa makan detikan). 2 detik masih terasa
; instan saat ngoding, tapi memangkas jumlah stat() secara drastis.
opcache.revalidate_freq = 2
opcache.jit = disable

; Cache hasil resolusi path — berpengaruh besar pada bind mount yang lambat
realpath_cache_size = 8192K
realpath_cache_ttl = 300

; Cookie secure dimatikan supaya sesi tetap jalan di http://localhost
session.cookie_secure = 0

; --- Xdebug -----------------------------------------------------------------
; Aktifkan step debugging dengan: XDEBUG_MODE=debug docker compose up
zend_extension = xdebug
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
xdebug.log_level = 0
