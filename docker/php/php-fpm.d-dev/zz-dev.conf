[www]
; Slowlog memakai ptrace, yang tidak diizinkan di container tanpa CAP_SYS_PTRACE.
; Hasilnya hanya spam "failed to ptrace(ATTACH)" di log. Matikan saat development.
request_slowlog_timeout = 0

; Saat debugging dengan Xdebug, request bisa berhenti lama di breakpoint.
request_terminate_timeout = 0

; Lebih sedikit worker sudah cukup untuk satu pengembang, dan hemat RAM.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 0
