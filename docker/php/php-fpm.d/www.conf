[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 511

; PENTING: jangan bersihkan environment, karena Laravel membaca konfigurasi
; (DB_HOST, APP_KEY, dst.) dari environment variable container.
clear_env = no

; Proses manager. Untuk container, "dynamic" dengan batas yang jelas lebih aman
; daripada "ondemand" karena menjaga worker tetap hangat.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Daur ulang worker untuk mencegah memory leak menumpuk
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping
ping.response = pong

; Log slow request supaya endpoint lambat gampang ketahuan
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
request_terminate_timeout = 60s

; Kirim log akses & error PHP ke stdout/stderr container
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
