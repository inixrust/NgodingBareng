apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: laravel
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: fastcgi
      port: 9000
      targetPort: fastcgi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: laravel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/component: php-fpm
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid www-data pada image Alpine PHP resmi.
        # php-fpm biasanya start sebagai root lalu menurunkan hak worker-nya.
        # Di sini seluruh proses — termasuk master — sudah non-root sejak awal,
        # supaya lolos Pod Security "restricted".
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: php-fpm
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: fastcgi
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # fpm-ping memanggil ping.path lewat protokol FastCGI, jadi probe ini
          # membuktikan php-fpm benar-benar bisa memproses request — bukan
          # sekadar port 9000 sedang terbuka.
          startupProbe:
            exec: { command: ["fpm-ping"] }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            exec: { command: ["fpm-ping"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["fpm-ping"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Beri kesempatan Service menghapus pod dari endpoint sebelum
              # php-fpm berhenti, supaya tidak ada request yang jatuh ke pod
              # yang sedang mati saat rolling update.
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            # rootfs read-only, jadi direktori yang memang harus writable
            # dipasang eksplisit satu per satu.
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: app-storage
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
  namespace: laravel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
