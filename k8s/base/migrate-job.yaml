# Migrasi dijalankan Job terpisah, bukan oleh entrypoint tiap pod.
#
# Kalau setiap pod app bermigrasi sendiri, 2 replika akan menjalankan migrasi
# yang sama secara bersamaan saat rollout. Job memberi satu titik eksekusi yang
# jelas, statusnya terlihat (`kubectl get job`), dan gagalnya kelihatan.
#
# `--isolated` aman di sini KARENA cache store-nya Redis. Kalau cache store
# kembali ke database, lock-nya akan disimpan di tabel cache_locks yang justru
# baru dibuat oleh migrasi itu sendiri, dan database kosong selalu gagal.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: laravel
  annotations:
    # Ubah nilai ini (atau hapus Job-nya) untuk memaksa migrasi dijalankan ulang.
    # Spec Job bersifat immutable, jadi `kubectl apply` pada Job yang sudah ada
    # akan ditolak.
    app.kubernetes.io/revision: "1"
spec:
  backoffLimit: 3
  # Job yang sudah selesai dibersihkan otomatis setelah 10 menit
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: app
      automountServiceAccountToken: false
      initContainers:
        # Service "mysql" dan "redis" bersifat headless: selama belum ada pod
        # yang Ready, namanya belum punya record DNS sama sekali dan resolusi
        # gagal dengan NXDOMAIN. Job yang langsung jalan saat apply akan
        # kehabisan backoffLimit sebelum database sempat hidup.
        # `migrate --isolated` butuh Redis juga, karena lock-nya disimpan di sana.
        - name: wait-for-deps
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              wait_for() {
                echo "menunggu $1:$2 ..."
                until php -r 'exit(@fsockopen($argv[1], (int) $argv[2], $e, $s, 2) ? 0 : 1);' "$1" "$2"; do
                  sleep 2
                done
                echo "$1:$2 siap."
              }
              wait_for "$DB_HOST" "$DB_PORT"
              wait_for "$REDIS_HOST" "$REDIS_PORT"
              wait_for "$REDIS_CACHE_HOST" "$REDIS_CACHE_PORT"
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["php", "artisan", "migrate", "--force", "--isolated"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: app-storage }
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
