# Redis #2 — cache saja.
#
# allkeys-lru: justru DIHARAPKAN membuang entri lama saat memori penuh — itu
# memang sifat cache. Tanpa persistensi, karena isinya bisa dibangun ulang
# kapan saja dari sumber aslinya.
#
# Kebijakan eviction Redis berlaku per-server, bukan per-database. Itulah alasan
# cache dipisahkan dari queue: satu instance tidak bisa memakai dua kebijakan.
appendonly no
save ""
maxmemory 256mb
maxmemory-policy allkeys-lru
