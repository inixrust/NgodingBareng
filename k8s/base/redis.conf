# Redis #1 — queue (Horizon) + session.
#
# noeviction: isi Redis ini TIDAK BOLEH dibuang. Membuang key di sini berarti
# membuang job yang masih mengantre, tanpa jejak dan tanpa ada yang tahu.
# AOF menyala supaya antrean selamat dari restart pod.
#
# Baris `requirepass` TIDAK ada di file ini. initContainer menempelkannya dari
# Secret saat pod start, sehingga password tidak pernah muncul di ConfigMap
# maupun di command line proses redis-server.
appendonly yes
appendfsync everysec
maxmemory 256mb
maxmemory-policy noeviction
dir /data
save 900 1
