# Satu ServiceAccount per workload, bukan "default" bersama.
#
# Tidak ada satu pun yang diberi Role/RoleBinding: aplikasi ini tidak perlu
# bicara dengan API Kubernetes sama sekali. automountServiceAccountToken: false
# membuat token-nya bahkan tidak dipasang ke dalam pod, sehingga container yang
# berhasil dikompromikan tidak punya kredensial apa pun untuk dipakai lebih jauh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: laravel
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caddy
  namespace: laravel
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql
  namespace: laravel
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: laravel
automountServiceAccountToken: false
