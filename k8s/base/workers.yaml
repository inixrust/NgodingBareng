# Horizon dan scheduler memakai image yang PERSIS SAMA dengan app, hanya beda
# perintah — sehingga mustahil ada perbedaan versi kode antar proses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon
  namespace: laravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon
  strategy:
    # Recreate, bukan RollingUpdate: dua supervisor Horizon yang hidup bersamaan
    # akan berebut queue yang sama.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon
        app.kubernetes.io/component: queue-worker
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Horizon menghubungi Redis SAAT BOOT untuk mulai mengawasi queue. Bila
      # DNS Redis belum siap (pod Redis belum Ready), ia keluar dengan
      # "getaddrinfo for redis failed" dan crash-loop sampai Redis hidup.
      # initContainer ini menahan start sampai dependensi benar-benar bisa
      # dihubungi — pola yang sama dengan migrate-job.
      initContainers:
        - name: wait-for-deps
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              wait_for() {
                echo "menunggu $1:$2 ..."
                until php -r 'exit(@fsockopen($argv[1], (int) $argv[2], $e, $s, 2) ? 0 : 1);' "$1" "$2"; do
                  sleep 2
                done
                echo "$1:$2 siap."
              }
              wait_for "$DB_HOST" "$DB_PORT"
              wait_for "$REDIS_HOST" "$REDIS_PORT"
              wait_for "$REDIS_CACHE_HOST" "$REDIS_CACHE_PORT"
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: horizon
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["php", "artisan", "horizon"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          readinessProbe:
            exec: { command: ["php", "artisan", "horizon:status"] }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
          livenessProbe:
            exec: { command: ["php", "artisan", "horizon:status"] }
            initialDelaySeconds: 40
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              # Horizon menangkap SIGTERM lalu menunggu job yang sedang jalan
              # selesai. `horizon:terminate` memintanya berhenti dengan rapi.
              exec:
                command: ["php", "artisan", "horizon:terminate"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 640Mi }
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      # Cukup lama untuk membiarkan job yang sedang berjalan selesai
      terminationGracePeriodSeconds: 60
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: app-storage }
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: laravel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  strategy:
    # Wajib Recreate: dua scheduler berarti setiap tugas terjadwal jalan dua kali.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # schedule:work membaca konfigurasi dan bisa langsung menyentuh Redis/DB
      # saat boot. Menahan start sampai dependensi siap mencegah crash-loop
      # cold-start yang sama seperti pada Horizon.
      initContainers:
        - name: wait-for-deps
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              set -eu
              wait_for() {
                echo "menunggu $1:$2 ..."
                until php -r 'exit(@fsockopen($argv[1], (int) $argv[2], $e, $s, 2) ? 0 : 1);' "$1" "$2"; do
                  sleep 2
                done
                echo "$1:$2 siap."
              }
              wait_for "$DB_HOST" "$DB_PORT"
              wait_for "$REDIS_HOST" "$REDIS_PORT"
              wait_for "$REDIS_CACHE_HOST" "$REDIS_CACHE_PORT"
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
      containers:
        - name: scheduler
          image: laravel-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["php", "artisan", "schedule:work"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 60
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: app-storage }
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
