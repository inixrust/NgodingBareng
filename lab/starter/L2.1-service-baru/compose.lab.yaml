# L2.1 — Menambah Service Baru ke Stack
#
# Tambahkan Mailpit: server SMTP palsu yang menangkap seluruh email saat
# pengembangan, sehingga tidak ada email yang benar-benar terkirim.
#
# Menjalankan (dari akar proyek):
#     docker compose -f compose.yaml -f compose.override.yaml \
#         -f lab/starter/L2.1-service-baru/compose.lab.yaml up -d
# =============================================================================

