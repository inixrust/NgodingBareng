apiVersion: v1
kind: Pod
metadata:
  name: latihan-pss
  namespace: laravel
  labels:
    app.kubernetes.io/name: latihan-pss
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  # TODO [3] — Pesan penolakan menyebut setiap pelanggaran satu per satu.
