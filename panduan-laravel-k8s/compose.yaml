# Docker Compose untuk pengembangan lokal TANPA Kubernetes.
#
# Tujuannya bukan meniru produksi persis, melainkan memberi developer siklus
# edit-refresh yang cepat. Perbedaan yang disengaja terhadap Kubernetes:
#   - kode di-bind-mount dari host (tidak perlu rebuild image tiap edit)
#   - OPcache dimatikan
#   - Xdebug aktif
#   - MariaDB dan Redis mengekspos port ke host agar bisa dibuka DBeaver dsb.
#
# Jalankan:  docker compose up -d --build
# Buka:      http://localhost:8080

name: laravel-k8s-guide

x-app-env: &app-env
  APP_NAME: Laravel
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:?jalankan scripts/generate-key.sh lalu isi APP_KEY di .env}
  APP_URL: http://localhost:8080

  LOG_CHANNEL: stderr
  LOG_LEVEL: debug

  DB_CONNECTION: mariadb
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-laravel}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-rahasia-lokal}

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CACHE_HOST: redis-cache

  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  # Cache konfigurasi dimatikan saat development supaya perubahan .env
  # langsung berlaku tanpa perlu restart container.
  SKIP_OPTIMIZE: "true"

services:
  # ------------------------------------------------------------------ PHP-FPM
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment: *app-env
    volumes:
      # Kode di-bind-mount: edit di host, langsung berlaku di container.
      - ./src:/var/www/html
      # vendor/ dan node_modules/ memakai named volume, BUKAN bind mount.
      # Alasannya kinerja: di Windows/macOS, bind mount berisi puluhan ribu
      # berkas kecil membuat autoload Composer 10x lebih lambat.
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  # -------------------------------------------------------------------- Nginx
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # public/ ikut di-mount karena saat development berkas statis berubah
      # terus. Di produksi, berkas ini dibakar ke dalam image Nginx.
      - ./src/public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ MariaDB
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_USER: ${DB_USERNAME:-laravel}
      MARIADB_PASSWORD: ${DB_PASSWORD:-rahasia-lokal}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-lokal}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # healthcheck.sh disediakan image MariaDB resmi dan benar-benar
      # menguji koneksi -- berbeda dari 'mysqladmin ping' yang tetap keluar
      # dengan kode 0 walaupun autentikasinya ditolak.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------- Redis (queue + session)
  redis:
    image: redis:7.4-alpine
    # noeviction: data antrian dan sesi TIDAK BOLEH dibuang diam-diam saat
    # memori penuh. Lebih baik penulisan ditolak dengan error yang terlihat
    # daripada job menghilang tanpa jejak.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------- Redis (cache saja)
  redis-cache:
    image: redis:7.4-alpine
    # allkeys-lru: cache MEMANG boleh dibuang saat penuh -- itu gunanya cache.
    # Kebijakan eviction bersifat per-server, bukan per-database, sehingga
    # cache dan antrian harus dipisah ke dua instance kalau ingin keduanya
    # memakai kebijakan yang tepat.
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------- Queue worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment: *app-env
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  # -------------------------------------------------------------- Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment: *app-env
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    # schedule:work adalah versi foreground dari cron; cocok untuk container.
    # Di Kubernetes, ini diganti CronJob (lihat docs/12-scheduler.md).
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  # ------------------------------------------------------------ Vite (HMR)
  vite:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    # --host 0.0.0.0 wajib: tanpa itu Vite hanya mendengarkan di dalam
    # container dan browser di host tidak bisa menjangkaunya.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mariadb-data:
  redis-data:
  vendor:
  node_modules:
