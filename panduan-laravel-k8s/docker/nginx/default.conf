# Virtual host aplikasi Laravel.
#
# Nginx berjalan di Pod TERPISAH dari PHP-FPM, jadi ia menjangkau FPM lewat
# Service Kubernetes bernama "laravel-fpm". Nama itu sama persis di Docker
# Desktop maupun kubeadm -- inilah salah satu alasan manifest bisa portabel:
# yang dijadikan acuan adalah nama Service, bukan IP.

upstream php-fpm {
    server laravel-fpm:9000;
    keepalive 16;                   # pakai ulang koneksi FastCGI
}

server {
    # Port >1024 supaya proses non-root bisa bind tanpa capability apa pun.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # --- header keamanan --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- endpoint kesehatan Nginx ----------------------------------------
    # Sengaja TIDAK menyentuh PHP. Dipakai livenessProbe: yang diuji adalah
    # "apakah proses Nginx ini masih hidup", bukan "apakah backend sehat".
    # Kalau probe liveness ikut menguji PHP, matinya PHP akan ikut membunuh
    # seluruh Pod Nginx -- kegagalan berantai yang tidak perlu.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- endpoint internal PHP-FPM ---------------------------------------
    # Hanya boleh diakses dari dalam klaster (jaringan Pod RFC1918).
    # Dipakai php-fpm_exporter untuk metrik.
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        include fastcgi_params;
        fastcgi_pass php-fpm;
    }

    # --- berkas statis ----------------------------------------------------
    # Dilayani langsung dari disk. Inilah alasan Nginx ada: request gambar
    # dan CSS tidak perlu membangunkan worker PHP sama sekali.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- rute aplikasi ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- eksekusi PHP -----------------------------------------------------
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # PENTING: SCRIPT_FILENAME memakai $document_root, bukan path yang
        # dikirim klien. Ini yang mencegah eksekusi berkas sembarangan.
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # Skema asli diteruskan supaya url() dan route() Laravel menghasilkan
        # https:// ketika TLS diterminasi di Ingress. $fcgi_https berasal
        # dari map di nginx.conf dan bernilai "on" HANYA bila permintaan
        # aslinya memang https.
        fastcgi_param HTTPS $fcgi_https if_not_empty;

        fastcgi_hide_header X-Powered-By;

        # Timeout. Nilai ini harus SELARAS dengan:
        #   - max_execution_time di php.ini (30s)
        #   - anotasi proxy-read-timeout di Ingress
        # Ketidakselarasan di antara ketiganya adalah penyebab 504 yang
        # paling sering dan paling membingungkan.
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;

        fastcgi_keep_conn on;
    }

    # Selain index.php, tidak ada berkas .php lain yang boleh dieksekusi.
    # Laravel memang hanya punya satu front controller.
    location ~ \.php$ {
        return 404;
    }

    # Berkas tersembunyi (.env, .git, .htaccess) tidak pernah dilayani.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
