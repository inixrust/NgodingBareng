# nginx.conf utama. Menimpa bawaan image agar log berbentuk JSON dan
# seluruh state runtime diarahkan ke /tmp (syarat readOnlyRootFilesystem).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- path sementara ---------------------------------------------------
    # Semua diarahkan ke /tmp karena root filesystem container bersifat
    # read-only; /tmp adalah emptyDir yang dipasang dari manifest.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # --- log terstruktur --------------------------------------------------
    # JSON satu baris: bisa langsung diurai Loki/Elasticsearch tanpa regex.
    # request_time dan upstream_response_time memisahkan "lambat karena
    # jaringan" dari "lambat karena PHP" -- pembeda penting saat mengejar 504.
    log_format json escape=json '{'
        '"waktu":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"metode":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"'
    '}';

    access_log /dev/stdout json;

    # --- pemetaan skema asli ----------------------------------------------
    # TLS diterminasi di Ingress, jadi Nginx menerima HTTP polos. Tanpa
    # pemetaan ini, Laravel akan membuat URL http:// pada situs https://.
    #
    # Perhatikan bahwa nilainya dipetakan, bukan diteruskan mentah: mengirim
    # HTTPS="http" tetap dianggap "aktif" oleh PHP karena PHP hanya memeriksa
    # apakah variabelnya tidak kosong.
    map $http_x_forwarded_proto $fcgi_https {
        default "";
        https   "on";
    }

    # --- kinerja ----------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;              # jangan bocorkan versi Nginx

    client_max_body_size 20m;       # harus >= post_max_size di php.ini

    # --- kompresi ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml application/wasm;

    include /etc/nginx/conf.d/*.conf;
}
