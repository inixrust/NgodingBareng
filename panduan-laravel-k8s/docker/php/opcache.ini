; OPcache: menyimpan bytecode PHP yang sudah dikompilasi di memori bersama.
; Tanpa ini, setiap request mengompilasi ulang ribuan berkas Laravel.
; Dampaknya pada aplikasi Laravel biasanya 3-5x lebih cepat.

opcache.enable = 1
opcache.enable_cli = 0

; Ukuran memori bytecode. Laravel + vendor umumnya butuh 90-140 MB.
opcache.memory_consumption = 192

; Buffer untuk string yang dipakai berulang (nama kelas, path).
opcache.interned_strings_buffer = 16

; Jumlah berkas yang boleh di-cache. Laravel + vendor bisa >10.000 berkas;
; bila angka ini kekecilan, OPcache diam-diam berhenti meng-cache sisanya.
opcache.max_accelerated_files = 20000

; INI YANG PALING PENTING DI PRODUKSI:
; 0 = jangan pernah memeriksa apakah berkas berubah di disk.
; Aman karena image bersifat immutable -- kode hanya berubah lewat deploy
; image baru, dan deploy berarti container baru dengan OPcache kosong.
; Menghemat satu stat() per berkas per request.
opcache.validate_timestamps = 0

; Simpan komentar: Laravel dan beberapa paket membaca anotasi/atribut.
opcache.save_comments = 1

; Jangan menulis ulang file cache saat shutdown container.
opcache.fast_shutdown = 1
