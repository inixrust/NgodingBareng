; Setelan PHP untuk container. Nilai di sini sengaja eksplisit supaya
; perilaku produksi tidak bergantung pada default image yang bisa berubah.

; --- keamanan -------------------------------------------------------------
expose_php = Off                  ; sembunyikan versi PHP dari header respons
display_errors = Off              ; error tidak pernah bocor ke browser
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr           ; log ke stderr -> ditangkap kubectl logs

; --- batas sumber daya ----------------------------------------------------
memory_limit = 256M               ; harus <= limits.memory container
max_execution_time = 30           ; request web; worker antrian punya nilai sendiri
post_max_size = 20M
upload_max_filesize = 20M
max_file_uploads = 20

; --- waktu ----------------------------------------------------------------
date.timezone = Asia/Jakarta

; --- sesi -----------------------------------------------------------------
; Laravel mengelola sesinya sendiri lewat driver Redis; setelan ini hanya
; jaring pengaman bila ada kode yang memanggil session_start() langsung.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; --- realpath cache -------------------------------------------------------
; Laravel menyentuh ribuan berkas per request. Cache ini menghilangkan
; sebagian besar syscall stat() setelah request pertama.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
