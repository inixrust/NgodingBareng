; Pool PHP-FPM. Menimpa www.conf bawaan image.
[www]
user = app
group = app

; Dengarkan di TCP, bukan unix socket: Nginx berjalan di Pod yang BERBEDA
; sehingga harus menjangkau lewat jaringan (Service laravel-fpm:9000).
listen = 0.0.0.0:9000

; ---- manajemen proses ----------------------------------------------------
; 'dynamic' menyesuaikan jumlah worker dengan beban. Di Kubernetes, jumlah
; worker per Pod sengaja dibuat kecil dan penambahan kapasitas diserahkan
; ke HPA (menambah Pod), bukan menambah worker di satu Pod. Alasannya:
; satu Pod = satu unit penjadwalan yang bisa dipindahkan scheduler.
pm = dynamic
pm.max_children = 20          ; 20 x 256M memory_limit = plafon teoretis 5G,
                              ; tetapi pemakaian nyata Laravel ~40-80M/worker
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Daur ulang worker untuk mencegah kebocoran memori menumpuk.
pm.max_requests = 500

; ---- pemantauan & probe --------------------------------------------------
pm.status_path = /fpm-status   ; dibaca php-fpm_exporter (lihat docs/18)
ping.path = /fpm-ping          ; dipakai probe kesehatan
ping.response = pong

; ---- log -----------------------------------------------------------------
; Semua log ke stderr agar bisa dibaca `kubectl logs`. Jangan menulis ke
; berkas: filesystem container bersifat read-only dan efemeral.
access.log = /dev/null         ; access log adalah tugas Nginx, bukan FPM
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Laporkan request yang lambat -- sangat membantu saat mengejar 504.
request_slowlog_timeout = 5s
slowlog = /dev/stderr

; Batasi ekstensi yang boleh dieksekusi: pertahanan berlapis bila ada
; berkas terunggah yang lolos ke direktori yang bisa dijangkau.
security.limit_extensions = .php
