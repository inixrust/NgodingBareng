# ============================================================================
# ALTERNATIF: Local Persistent Volume
#
# Berkas ini TIDAK dipakai oleh overlay mana pun. Ia disediakan sebagai
# pembanding, untuk kasus ketika Anda memilih Local PV alih-alih NFS.
#
# Kapan Local PV tepat:
#   - Database yang butuh IOPS setinggi mungkin (NVMe lokal).
#   - Beban kerja yang memang terikat ke satu Node.
#
# Kapan Local PV TIDAK BOLEH dipakai:
#   - Ketika butuh ReadWriteMany. Local PV hanya RWO.
#   - Ketika Pod harus bisa dijadwalkan ulang ke Node mana pun. Local PV
#     MENGUNCI Pod ke Node pemilik disk; kalau Node itu mati, Pod-nya Pending
#     selamanya dan datanya tidak bisa dijangkau.
#
# Itulah sebabnya PVC laravel-storage (berkas unggahan, dibagi tiga Deployment
# di tiga Node) memakai NFS, sementara database boleh memakai Local PV.
# ============================================================================

# ------------------------------------------------------------- StorageClass
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
# Tidak ada provisioner dinamis: setiap PV harus dibuat manual.
provisioner: kubernetes.io/no-provisioner
# WaitForFirstConsumer adalah SATU-SATUNYA nilai yang benar untuk Local PV.
#
# Dengan Immediate, PVC langsung terikat ke PV di Node acak SEBELUM scheduler
# tahu di mana Pod-nya akan berjalan. Akibatnya scheduler dipaksa menaruh Pod
# di Node itu -- meski Node tersebut penuh atau punya taint yang menolak Pod.
# Gejalanya: Pod Pending dengan alasan yang tidak masuk akal.
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
---
# ------------------------------------------------------------ PV per Node
# Direktori harus dibuat lebih dulu di Node yang bersangkutan:
#   ssh 192.168.50.15 'sudo mkdir -p /mnt/disks/mariadb && sudo chmod 700 /mnt/disks/mariadb'
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-mariadb-worker1
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/disks/mariadb
  # nodeAffinity WAJIB pada Local PV. Inilah yang memberi tahu scheduler di
  # Node mana volume ini benar-benar berada. Tanpa itu, Pod bisa dijadwalkan
  # di Node lain dan gagal memasang volume.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker1        # ganti dengan nama node sesungguhnya
                                 # (kubectl get nodes -o name)
---
# ============================================================================
# CATATAN: reclaimPolicy dan apa yang sebenarnya terjadi
#
#   Delete  - PV dan datanya dihapus ketika PVC dihapus.
#             Default untuk provisioning dinamis. Cepat, dan berbahaya:
#             satu `kubectl delete pvc` yang salah ketik menghapus database.
#
#   Retain  - PV dipertahankan berisi data ketika PVC dihapus. PV masuk
#             status "Released" dan TIDAK BISA dipakai PVC baru sampai
#             seorang administrator membersihkannya manual.
#             Inilah pilihan yang benar untuk data yang tidak tergantikan.
#
# Kejutan yang sering ditemui: dengan provisioner hostPath (Docker Desktop)
# maupun local-path, MENGHAPUS PVC TIDAK SELALU MENGHAPUS DATANYA di disk.
# Provisioner memetakan direktori berdasarkan nama PVC, jadi membuat ulang
# PVC dengan nama yang sama akan MEMAKAI KEMBALI data lama -- termasuk
# password database lama yang tersimpan di tabel mysql.user.
#
# Bila Anda perlu benar-benar memulai dari nol, hapus direktorinya:
#   lihat scripts/reset-database.sh
# ============================================================================
