# Konfigurasi NON-RAHASIA aplikasi.
#
# Aturan pemisahannya sederhana: apa pun yang boleh terlihat orang lain saat
# berbagi layar masuk ConfigMap; sisanya masuk Secret.
#
# Nilai di sini adalah default untuk SEMUA environment. Yang berbeda per
# environment (APP_URL, APP_DEBUG, LOG_LEVEL) ditimpa oleh overlay Kustomize
# -- bukan dengan menyalin berkas ini.
apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
data:
  APP_NAME: "Laravel"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://laravel.local"
  APP_TIMEZONE: "Asia/Jakarta"
  APP_LOCALE: "id"

  # stderr wajib di Kubernetes. Log yang ditulis ke berkas di dalam container
  # ikut hilang saat Pod dihapus, dan tidak pernah terbaca kubectl logs.
  LOG_CHANNEL: "stderr"
  LOG_STDERR_FORMATTER: 'Monolog\Formatter\JsonFormatter'
  LOG_LEVEL: "info"

  # --- database -----------------------------------------------------------
  # DB_HOST memakai NAMA SERVICE, bukan IP. Inilah kunci portabilitas: nama
  # "mariadb" resolvable persis sama di Docker Desktop maupun kubeadm.
  DB_CONNECTION: "mariadb"
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_DATABASE: "laravel"
  DB_USERNAME: "laravel"

  # --- redis --------------------------------------------------------------
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_CACHE_HOST: "redis-cache"
  REDIS_CACHE_PORT: "6379"
  REDIS_PREFIX: "laravel:"

  # Cache, sesi, dan antrian semuanya ke Redis. Ini prasyarat horizontal
  # scaling: dengan driver "file", sesi pengguna hanya ada di satu Pod, dan
  # request berikutnya yang mendarat di Pod lain akan dianggap belum login.
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  QUEUE_CONNECTION: "redis"
  BROADCAST_CONNECTION: "log"

  FILESYSTEM_DISK: "public"
  MAIL_MAILER: "log"

  # Laravel harus mempercayai header X-Forwarded-* dari Ingress agar url()
  # menghasilkan https:// dan request()->ip() memberi IP pengunjung asli.
  # Nilai "*" aman DI SINI karena Pod hanya bisa dijangkau lewat Ingress
  # (dipaksakan oleh NetworkPolicy), bukan dari internet secara langsung.
  TRUSTED_PROXIES: "*"
