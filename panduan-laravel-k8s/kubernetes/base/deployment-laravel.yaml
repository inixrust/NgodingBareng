# ============================================================================
# Laravel (PHP-FPM)
#
# Container ini TIDAK berbicara HTTP. Ia berbicara FastCGI di port 9000 dan
# hanya bisa dijangkau oleh Nginx. Pemisahan ini disengaja: berkas statis
# tidak perlu membangunkan worker PHP sama sekali.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-fpm
  labels:
    app.kubernetes.io/name: laravel-fpm
    app.kubernetes.io/component: app
spec:
  replicas: 2
  revisionHistoryLimit: 5      # simpan 5 ReplicaSet lama untuk rollback

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # 0 = tidak boleh ada satu pun Pod hilang selama rollout. Inilah yang
      # membuat pembaruan benar-benar tanpa downtime; harganya rollout jadi
      # sedikit lebih lambat dan butuh kapasitas 1 Pod ekstra.
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: laravel-fpm

  template:
    metadata:
      labels:
        app.kubernetes.io/name: laravel-fpm
        app.kubernetes.io/component: app
      annotations:
        # Anotasi ini diperbarui skrip deploy dengan hash isi ConfigMap+Secret
        # agar `kubectl apply` memicu rollout ketika konfigurasi berubah.
        # Tanpa mekanisme semacam ini, ConfigMap yang diubah tidak berdampak
        # apa pun sampai Pod kebetulan di-restart.
        checksum/config: "diisi-oleh-scripts/deploy.sh"
    spec:
      serviceAccountName: laravel
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      # Sebarkan replika ke Node berbeda supaya satu Node mati tidak
      # menjatuhkan seluruh aplikasi.
      # whenUnsatisfiable: ScheduleAnyway dipilih SECARA SENGAJA agar manifest
      # ini tetap jalan di Docker Desktop yang hanya punya satu Node. Dengan
      # DoNotSchedule, replika kedua akan Pending selamanya di sana.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: laravel-fpm

      # --- initContainer: tunggu dependensi ---------------------------------
      # PHP-FPM yang start sebelum database siap akan melempar error koneksi
      # pada request pertama. Menunggu di initContainer membuat Pod tidak
      # pernah masuk keadaan "Running tetapi rusak".
      initContainers:
        - name: tunggu-dependensi
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "menunggu mariadb:3306 dan redis:6379 ..."
              until nc -z mariadb 3306; do sleep 2; done
              until nc -z redis 6379; do sleep 2; done
              echo "dependensi siap"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "100m", memory: "32Mi" }

      containers:
        - name: php-fpm
          # Tag di sini hanya placeholder. Nilai sesungguhnya ditetapkan
          # overlay lewat transformer `images:` di kustomization.yaml.
          image: laravel-app/php:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: fastcgi
              containerPort: 9000

          # Semua konfigurasi masuk sebagai variabel lingkungan. Aplikasi
          # tidak pernah membaca berkas .env di dalam container.
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secret

          env:
            # Beberapa nilai hanya relevan untuk Pod ini, jadi tidak perlu
            # mengotori ConfigMap bersama.
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }

          # --- PROBE ---------------------------------------------------------
          # Ketiganya memakai cgi-fcgi, bukan tcpSocket. Alasannya: port 9000
          # sudah terbuka sejak master PHP-FPM start, bahkan ketika seluruh
          # worker macet. Probe TCP akan melaporkan "sehat" pada Pod yang
          # sebenarnya tidak bisa melayani satu request pun.
          startupProbe:
            exec:
              command: ["/usr/local/bin/fpm-healthcheck"]
            periodSeconds: 3
            # 40 x 3s = 120 detik. Cukup untuk config:cache + route:cache +
            # view:cache di entrypoint pada Node yang sedang sibuk.
            failureThreshold: 40
          readinessProbe:
            exec:
              command: ["/usr/local/bin/fpm-healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/fpm-healthcheck"]
            periodSeconds: 20
            timeoutSeconds: 5
            # Lebih longgar daripada readiness. Filosofinya: readiness gagal
            # -> berhenti dikirimi trafik (murah, reversibel). Liveness gagal
            # -> container DIBUNUH (mahal). Jangan sampai lonjakan beban
            # sesaat memicu restart beruntun.
            failureThreshold: 5

          # Beri jeda sebelum SIGTERM agar kube-proxy sempat mencabut Pod ini
          # dari EndpointSlice. Tanpa ini, sebagian request masih dikirim ke
          # Pod yang sudah mulai mati -- sumber 502 saat rollout.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]

          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              memory: "512Mi"
              # CPU limit sengaja dilonggarkan (bukan disamakan dengan
              # request). CPU adalah resource yang bisa dikompresi: melampaui
              # limit tidak membunuh container, hanya men-throttle-nya --
              # dan throttling PHP-FPM langsung terasa sebagai latensi.
              cpu: "1000m"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # Berkas unggahan: dibagi ke semua replika dan ke Nginx.
            - name: storage-app
              mountPath: /var/www/html/storage/app/public
            # Cache framework: per-Pod, tidak perlu dibagi.
            - name: storage-framework
              mountPath: /var/www/html/storage/framework
            # config:cache dan route:cache menulis ke sini.
            - name: bootstrap-cache
              mountPath: /var/www/html/bootstrap/cache
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: storage-app
          persistentVolumeClaim:
            claimName: laravel-storage
        - name: storage-framework
          emptyDir: {}
        - name: bootstrap-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
