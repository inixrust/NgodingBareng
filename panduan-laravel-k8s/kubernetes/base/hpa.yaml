# ============================================================================
# HorizontalPodAutoscaler
#
# apiVersion autoscaling/v2 adalah versi stabil saat ini. autoscaling/v2beta1
# dan v2beta2 SUDAH DIHAPUS dari Kubernetes -- manifest lama yang masih
# memakainya akan ditolak API server.
#
# --- PRASYARAT YANG SERING TERLEWAT ---------------------------------------
# HPA membaca metrik dari metrics-server. Tanpa metrics-server:
#   kubectl get hpa  ->  TARGETS menampilkan <unknown>/70%
# dan tidak ada penskalaan yang terjadi. metrics-server TIDAK terpasang
# secara default, baik di Docker Desktop maupun di klaster kubeadm baru.
# Cara memasangnya ada di docs/14-resource.md.
#
# --- HPA MEMBUTUHKAN requests ---------------------------------------------
# Target "70% CPU" berarti 70% dari resources.requests.cpu, BUKAN 70% dari
# kapasitas Node. Container tanpa requests membuat HPA tidak punya penyebut
# dan penskalaannya diam saja.
# ============================================================================

# ------------------------------------------------------------------ PHP-FPM
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-fpm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel-fpm
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memori dipantau sebagai jaring pengaman. Perlu diingat: menambah Pod
    # TIDAK menurunkan pemakaian memori per Pod bila penyebabnya kebocoran
    # memori. Metrik ini berguna untuk beban yang memang berat memori, bukan
    # untuk menambal kebocoran.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  # --- perilaku penskalaan ------------------------------------------------
  # Bagian ini yang membedakan HPA yang tenang dari HPA yang berosilasi.
  behavior:
    scaleUp:
      # Reaksi cepat saat beban naik: pengguna sedang menunggu.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100          # boleh menggandakan jumlah Pod
          periodSeconds: 30
        - type: Pods
          value: 4            # tetapi maksimal +4 Pod sekaligus
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Turun perlahan. 5 menit menunggu memastikan lonjakan yang datang
      # bergelombang tidak memicu naik-turun terus-menerus (flapping).
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min
---
# -------------------------------------------------------------------- Nginx
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-nginx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel-nginx
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
# ------------------------------------------------------------- Queue Worker
# CATATAN PENTING TENTANG AUTOSCALING WORKER
#
# CPU adalah proksi yang BURUK untuk antrian. Worker yang menunggu job
# menganggur di ~0% CPU, padahal antriannya bisa saja menumpuk 10.000 job.
# HPA berbasis CPU tidak akan menambah worker sama sekali.
#
# Yang benar adalah menskalakan berdasarkan PANJANG ANTRIAN, dan itu butuh
# custom/external metrics (KEDA, atau Prometheus Adapter). Contoh KEDA ada di
# docs/11-queue.md.
#
# HPA berbasis CPU di bawah tetap disertakan sebagai jaring pengaman untuk
# job yang memang berat CPU (pemrosesan gambar, ekspor laporan) -- bukan
# sebagai solusi utama.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: laravel-queue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: laravel-queue
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Sangat lambat turun. Menghapus worker berarti memutus job yang sedang
      # berjalan (setelah grace period), jadi lebih baik berhati-hati.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
