# ============================================================================
# BASE — kebenaran tunggal untuk seluruh environment.
#
# Aturan yang dipegang di base:
#   1. TIDAK ADA nilai spesifik environment. Tidak ada IP, tidak ada nama
#      StorageClass, tidak ada hostname, tidak ada tag image sungguhan.
#   2. Semua yang berbeda antar-environment diberi nilai netral di sini,
#      lalu ditimpa overlay.
#
# Base ini SENGAJA tidak bisa langsung di-apply sendiri sebagai produksi --
# ia adalah cetakan, bukan environment.
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laravel

resources:
  # --- fondasi & keamanan ---
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml

  # --- konfigurasi ---
  - configmap.yaml
  # secret.yaml SENGAJA TIDAK didaftarkan. Berkas itu hanya contoh struktur
  # berisi placeholder; Secret sungguhan dibuat scripts/create-secret.sh.
  # Bila didaftarkan di sini, setiap `kubectl apply -k` MENIMPA Secret asli
  # dengan placeholder -- dan MariaDB yang terlanjur inisialisasi memakai
  # placeholder itu akan menyimpannya permanen di datadir (bug yang pernah
  # benar-benar terjadi saat memverifikasi panduan ini).

  # --- penyimpanan ---
  - pvc.yaml

  # --- data ---
  - statefulset-mariadb.yaml
  - statefulset-redis.yaml
  - deployment-redis-cache.yaml

  # --- aplikasi ---
  - deployment-laravel.yaml
  - deployment-nginx.yaml
  - deployment-queue.yaml
  - cronjob-scheduler.yaml
  - job-migrate.yaml

  # --- jaringan ---
  - services.yaml
  - ingress.yaml
  - networkpolicy.yaml

  # --- kebijakan & penskalaan ---
  - hpa.yaml
  - pdb.yaml
  - resourcequota.yaml
  - limitrange.yaml

# --- label bersama ----------------------------------------------------------
# includeSelectors: false itu WAJIB dan sering salah.
#
# Bila true, Kustomize menambahkan label ini ke spec.selector Deployment.
# Padahal selector bersifat IMMUTABLE: begitu Deployment sudah ada di
# klaster, apply berikutnya akan gagal dengan "field is immutable" dan
# satu-satunya jalan keluar adalah menghapus Deployment-nya.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: laravel-stack
      app.kubernetes.io/managed-by: kustomize

# --- image ------------------------------------------------------------------
# Transformer ini yang membuat tag image tidak perlu ditulis ulang di setiap
# manifest. Overlay (dan pipeline CI) cukup menjalankan:
#     kustomize edit set image laravel-app/php=ghcr.io/org/php:v1.2.3
images:
  - name: laravel-app/php
    newTag: latest
  - name: laravel-app/nginx
    newTag: latest
