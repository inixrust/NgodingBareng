# Namespace aplikasi, sekaligus tempat kebijakan keamanan tingkat namespace
# dipasang. Membuat namespace sendiri (bukan memakai "default") memberi kita
# batas RBAC, batas kuota, dan sasaran NetworkPolicy yang jelas.
apiVersion: v1
kind: Namespace
metadata:
  name: laravel
  labels:
    # --- Pod Security Admission -------------------------------------------
    # PSA menggantikan PodSecurityPolicy yang dihapus di Kubernetes v1.25.
    # Ia diaktifkan murni lewat label namespace -- tidak ada objek terpisah.
    #
    # enforce=restricted menolak Pod yang tidak memenuhi profil paling ketat:
    #   runAsNonRoot, allowPrivilegeEscalation=false, drop ALL capabilities,
    #   seccompProfile RuntimeDefault, tanpa hostPath/hostNetwork/hostPID.
    #
    # Menaruhnya di sini berarti kesalahan konfigurasi keamanan ditolak saat
    # apply -- bukan ditemukan berbulan-bulan kemudian saat audit.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    app.kubernetes.io/name: laravel
    app.kubernetes.io/part-of: laravel-stack
