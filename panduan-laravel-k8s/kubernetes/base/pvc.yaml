# PersistentVolumeClaim untuk berkas unggahan Laravel (storage/app/public).
#
# --- KENAPA ReadWriteMany? -------------------------------------------------
# Deployment laravel-fpm punya beberapa replika, dan queue worker juga perlu
# menyentuh berkas yang sama (mis. memproses gambar yang baru diunggah).
# Dengan ReadWriteOnce, volume hanya bisa dipasang oleh Pod-Pod di SATU Node;
# begitu scheduler menaruh replika kedua di Node lain, Pod itu macet selamanya
# di ContainerCreating.
#
# Konsekuensi penting: pilihan RWX inilah yang menentukan rekomendasi storage
# di klaster kubeadm (NFS, bukan Local PV) -- lihat docs/07-persistent-storage.md.
#
# --- KENAPA storageClassName TIDAK DIISI DI SINI? --------------------------
# Karena nama StorageClass adalah satu-satunya hal yang benar-benar berbeda
# antara Docker Desktop (hostpath) dan kubeadm (nfs-client). Membiarkannya
# kosong di base dan mengisinya di overlay membuat berkas ini portabel.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laravel-storage
  labels:
    app.kubernetes.io/name: laravel
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  # storageClassName diisi oleh overlay:
  #   overlays/docker-desktop -> hostpath
  #   overlays/onprem         -> nfs-client
