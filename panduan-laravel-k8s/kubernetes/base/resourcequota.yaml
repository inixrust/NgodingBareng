# ============================================================================
# ResourceQuota — pagar untuk seluruh namespace
#
# Tanpa kuota, satu HPA yang salah setel (atau satu kebocoran memori) bisa
# menghabiskan kapasitas seluruh klaster dan menjatuhkan namespace lain.
# Kuota mengubah kegagalan itu menjadi penolakan yang jelas saat pembuatan
# Pod: "exceeded quota".
#
# --- KONSEKUENSI YANG HARUS DIPAHAMI --------------------------------------
# Begitu ResourceQuota membatasi cpu/memory, SETIAP container di namespace
# ini WAJIB punya requests dan limits. Pod tanpa keduanya akan DITOLAK.
# Itulah sebabnya LimitRange (berkas berikutnya) ada: ia mengisi default
# supaya Pod sederhana tetap bisa dibuat.
#
# Angka di bawah adalah plafon untuk seluruh stack ini pada beban penuh HPA.
# Overlay development menurunkannya; overlay produksi menaikkannya.
# ============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: laravel-quota
spec:
  hard:
    # --- komputasi ---------------------------------------------------------
    # requests = kapasitas yang DIPESAN (dasar penjadwalan)
    # limits   = plafon yang boleh dipakai
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "12"
    limits.memory: "12Gi"

    # --- penyimpanan -------------------------------------------------------
    requests.storage: "50Gi"
    persistentvolumeclaims: "10"

    # --- jumlah objek ------------------------------------------------------
    # Membatasi jumlah objek mencegah kesalahan otomasi (mis. CronJob yang
    # menumpuk Job) menghabiskan etcd.
    pods: "40"
    services: "10"
    secrets: "20"
    configmaps: "20"
    # Melindungi jaringan Node: setiap LoadBalancer memakan satu IP dari pool
    # MetalLB, dan pool itu terbatas.
    services.loadbalancers: "2"
    services.nodeports: "0"
    # ^ 0 = NodePort DILARANG di namespace ini. Dipaksakan agar akses dari
    #   luar selalu lewat Ingress, bukan lewat port acak di setiap Node.
