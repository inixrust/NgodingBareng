# Role: daftar izin, berlaku HANYA di dalam namespace laravel.
#
# Prinsip hak seminimal mungkin. Perhatikan tidak ada satu pun verb "delete",
# "create", atau wildcard. Job dan sidecar hanya perlu MEMBACA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: laravel-readonly
rules:
  # Membaca status Pod dan Service: dipakai job penunggu dependensi dan
  # exporter untuk menemukan target.
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

  # Membaca ConfigMap. Secret SENGAJA TIDAK dimasukkan: Secret sudah
  # di-inject sebagai variabel lingkungan oleh kubelet, jadi aplikasi tidak
  # perlu hak membacanya lewat API. Memberi hak get secrets berarti satu
  # celah RCE bisa berubah menjadi kebocoran seluruh kredensial namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Membaca status rollout: berguna untuk skrip verifikasi di dalam klaster.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
