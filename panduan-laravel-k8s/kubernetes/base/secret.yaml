# ============================================================================
# PERINGATAN
#
# Berkas ini adalah CONTOH STRUKTUR, bukan tempat menyimpan rahasia asli.
# Nilai di bawah adalah placeholder yang sengaja tidak valid.
#
# Jangan pernah meng-commit Secret asli ke Git. Secret Kubernetes hanya
# di-encode base64 -- itu penyandian, bukan enkripsi. Siapa pun yang bisa
# membaca berkasnya bisa mendekodenya dalam satu perintah.
#
# Pilihan yang benar untuk produksi (lihat docs/16-environment.md):
#   1. Sealed Secrets            - Secret terenkripsi aman di-commit; hanya
#                                  controller di klaster tujuan yang bisa
#                                  membukanya.
#   2. External Secrets Operator - rahasia tetap di Vault/AWS SM dan
#                                  disinkronkan ke klaster saat runtime.
#   3. SOPS + age                - enkripsi berbasis berkas, cocok tim kecil.
#
# Untuk menyiapkan klaster tanpa menaruh rahasia di repositori, pakai
# scripts/create-secret.sh (atau .ps1) yang menjalankan:
#
#   kubectl -n laravel create secret generic laravel-secret \
#     --from-literal=APP_KEY=... --from-literal=DB_PASSWORD=...
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: laravel-secret
type: Opaque
# stringData menerima teks biasa dan di-encode otomatis oleh API server.
# Lebih mudah dibaca manusia daripada blok data: yang sudah base64.
stringData:
  # Kunci enkripsi aplikasi. Mengganti nilai ini membuat SELURUH sesi, cookie
  # terenkripsi, dan kolom terenkripsi di database tidak bisa dibaca lagi.
  # Buat sekali per environment, lalu simpan baik-baik.
  APP_KEY: "base64:GANTI-DENGAN-HASIL-openssl-rand-base64-32"

  DB_PASSWORD: "GANTI-SAYA"
  DB_ROOT_PASSWORD: "GANTI-SAYA-JUGA"

  # Redis tanpa password masih aman selama NetworkPolicy membatasi aksesnya,
  # tetapi pertahanan berlapis tetap lebih baik.
  REDIS_PASSWORD: ""
