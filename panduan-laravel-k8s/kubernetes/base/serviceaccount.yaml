# ServiceAccount khusus aplikasi.
#
# Kenapa tidak memakai ServiceAccount "default"? Karena "default" ada di
# setiap namespace dan mudah sekali diberi izin berlebih oleh orang lain.
# Identitas sendiri membuat izin aplikasi ini bisa diaudit terpisah.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laravel
# Aplikasi Laravel tidak pernah memanggil API Kubernetes. Mematikan
# pemasangan token menghilangkan kredensial klaster dari dalam container,
# sehingga bila aplikasi berhasil ditembus, penyerang tidak mendapat pijakan
# untuk berbicara dengan API server.
automountServiceAccountToken: false
---
# ServiceAccount terpisah untuk komponen yang MEMANG perlu membaca API
# (misalnya sidecar exporter atau job yang menunggu resource lain siap).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: laravel-ops
automountServiceAccountToken: true
