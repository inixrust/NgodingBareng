# ============================================================================
# MariaDB
#
# CATATAN PENYIMPANGAN DARI DAFTAR BERKAS
# Berkas ini bernama statefulset-, bukan deployment-mariadb.yaml. Ini
# disengaja, dan alasannya penting:
#
#   1. Deployment dengan strategi RollingUpdate akan membuat Pod BARU sebelum
#      Pod lama mati. Kedua Pod lalu mencoba memasang PVC yang sama dan
#      menulis ke datadir InnoDB yang sama sekaligus -- jalan tercepat menuju
#      korupsi data.
#   2. StatefulSet memberi identitas stabil (mariadb-0) dan nama DNS stabil,
#      yang dibutuhkan bila nanti ditambahkan replika.
#   3. volumeClaimTemplates memastikan setiap replika mendapat volumenya
#      sendiri, bukan berebut satu volume.
#
# Untuk produksi sungguhan, pertimbangkan operator (MariaDB Operator,
# Percona, atau Vitess) atau database terkelola. Satu instance seperti di
# sini tetap merupakan titik kegagalan tunggal.
#
# --- KENAPA MARIADB, BUKAN MYSQL? -----------------------------------------
# Lihat pembahasan lengkap di docs/01-arsitektur.md. Ringkasnya:
#   - Laravel 11+ punya driver "mariadb" tersendiri, jadi dukungannya resmi.
#   - Image-nya lebih ramping dan start-nya lebih cepat -- terasa saat Pod
#     dijadwalkan ulang.
#   - Lisensinya murni GPL tanpa edisi enterprise terpisah.
#   - Pemakaian memori idle-nya lebih kecil, cocok untuk node on-premise.
# Ingin tetap memakai MySQL? Ganti image ke mysql:8.4, ubah nama variabel
# MARIADB_* menjadi MYSQL_*, dan set DB_CONNECTION=mysql di ConfigMap.
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: laravel
      automountServiceAccountToken: false

      # Pod-level security context. fsGroup membuat kubelet mengubah
      # kepemilikan volume ke GID ini saat dipasang -- tanpa itu, proses
      # non-root tidak bisa menulis ke PVC yang baru dibuat.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # uid "mysql" pada image resmi MariaDB
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch   # hindari chown ulang tiap start
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 60   # beri waktu InnoDB menutup rapi

      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent

          args:
            # Setelan yang paling menentukan kinerja MariaDB. Ditaruh sebagai
            # argumen agar terlihat jelas, bukan tersembunyi di berkas config.
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            # 60-70% dari limits.memory. Ini cache data+index InnoDB; nilai
            # terlalu kecil membuat setiap query menyentuh disk.
            - --innodb-buffer-pool-size=1G
            # 1 = paling aman (flush tiap commit). Ubah ke 2 hanya bila
            # kehilangan 1 detik transaksi terakhir bisa diterima.
            - --innodb-flush-log-at-trx-commit=1
            - --max-connections=200
            - --skip-name-resolve       # jangan reverse-DNS tiap koneksi

          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef: { name: laravel-config, key: DB_DATABASE }
            - name: MARIADB_USER
              valueFrom:
                configMapKeyRef: { name: laravel-config, key: DB_USERNAME }
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: laravel-secret, key: DB_PASSWORD }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: laravel-secret, key: DB_ROOT_PASSWORD }
            # Menjalankan mariadb-upgrade otomatis setelah image dinaikkan
            # versinya; tanpa ini server menolak start pada datadir lama.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"

          ports:
            - name: mysql
              containerPort: 3306

          # --- PROBE --------------------------------------------------------
          # healthcheck.sh disediakan image MariaDB resmi dan benar-benar
          # membuka koneksi. Jangan memakai "mysqladmin ping": perintah itu
          # keluar dengan kode 0 bahkan ketika autentikasi ditolak, sehingga
          # melaporkan sehat pada database yang sebenarnya tidak bisa dipakai.
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            # 30 x 5s = 150 detik. Inisialisasi datadir pertama kali memang
            # lama; startupProbe-lah yang memberi kelonggaran itu tanpa harus
            # melonggarkan livenessProbe selamanya.
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5   # longgar: restart database itu mahal

          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              # memory limit == request -> QoS Guaranteed. Database adalah
              # komponen terakhir yang boleh diusir saat Node kehabisan memori.
              memory: "1536Mi"
              cpu: "2000m"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # Dibutuhkan karena root filesystem read-only.
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

  # volumeClaimTemplates membuat PVC per replika secara otomatis, dengan nama
  # yang bisa ditebak: data-mariadb-0.
  #
  # PENTING: PVC ini TIDAK ikut terhapus saat StatefulSet dihapus. Itu memang
  # disengaja (melindungi data), tetapi berarti "hapus lalu deploy ulang"
  # akan memakai kembali data lama -- termasuk password lama yang tersimpan
  # di tabel mysql.user. Untuk benar-benar mengulang dari nol, PVC-nya harus
  # dihapus manual (lihat scripts/reset-database.sh).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        # storageClassName diisi overlay.
