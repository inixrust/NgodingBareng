# ============================================================================
# OVERLAY: Docker Desktop (development)
#
# Deploy:
#   kubectl apply -k kubernetes/overlays/docker-desktop
#
# Perbedaannya terhadap base hanya EMPAT hal, dan semuanya memang tidak bisa
# dihindari:
#   1. StorageClass    -> "hostpath" (bawaan Docker Desktop)
#   2. Host Ingress    -> laravel.localhost
#   3. Replika & resource diperkecil (satu Node, laptop)
#   4. HPA dihapus     -> metrics-server tidak terpasang di Docker Desktop
#
# Semua yang lain -- nama Service, struktur Deployment, probe, securityContext,
# NetworkPolicy -- persis sama dengan produksi. Itulah tujuannya: yang Anda
# uji di laptop adalah objek yang sama dengan yang berjalan di on-premise.
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laravel

resources:
  - ../../base

# --- nama image -------------------------------------------------------------
# Tag "dev" dan imagePullPolicy IfNotPresent membuat Kubernetes memakai image
# yang ada di daemon Docker lokal.
#
# CATATAN PENTING: Docker Desktop berbagi image daemon dengan Kubernetes-nya,
# jadi `docker build` saja sudah cukup -- TIDAK perlu `kind load` atau push ke
# registry. Ini berbeda dengan kind/minikube.
#
# Jangan memakai tag "latest" di sini: dengan imagePullPolicy default,
# "latest" memicu Always pull dan Kubernetes akan mencari image itu di Docker
# Hub, lalu gagal dengan ImagePullBackOff.
images:
  - name: laravel-app/php
    newName: laravel-app/php
    newTag: dev
  - name: laravel-app/nginx
    newName: laravel-app/nginx
    newTag: dev

# --- konfigurasi khusus development ----------------------------------------
patches:
  # 1. ConfigMap: debug menyala, log verbose, URL lokal
  - target:
      kind: ConfigMap
      name: laravel-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: local
      - op: replace
        path: /data/APP_DEBUG
        value: "true"
      - op: replace
        path: /data/APP_URL
        value: http://laravel.localhost
      - op: replace
        path: /data/LOG_LEVEL
        value: debug

  # 2. Ingress: host lokal.
  #    *.localhost sudah menunjuk 127.0.0.1 di semua sistem operasi modern,
  #    jadi tidak perlu mengedit berkas hosts sama sekali.
  - target:
      kind: Ingress
      name: laravel
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: laravel.localhost

  # 3. StorageClass. "hostpath" adalah provisioner bawaan Docker Desktop dan
  #    sudah menjadi default, tetapi ditulis eksplisit supaya perbedaan
  #    antar-environment terlihat jelas di satu tempat.
  - target:
      kind: PersistentVolumeClaim
      name: laravel-storage
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: hostpath
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi

  - target:
      kind: StatefulSet
      name: mariadb
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: hostpath
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi

  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: hostpath
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi

  # 4. HPA dihapus.
  #    $patch: delete adalah cara Kustomize membuang resource yang datang
  #    dari base. Diperlukan karena tanpa metrics-server, HPA hanya akan
  #    menampilkan <unknown>/70% dan membingungkan.
  #    Ingin mencobanya? Pasang metrics-server (docs/14) lalu hapus tiga blok
  #    berikut.
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: laravel-fpm
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: laravel-nginx
      $patch: delete
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: laravel-queue
      $patch: delete

  # 5. PodDisruptionBudget dihapus.
  #    Di klaster satu Node, PDB tidak melindungi apa pun (tidak ada Node lain
  #    tujuan pemindahan) dan justru membuat drain menggantung.
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: laravel-fpm
      $patch: delete
  - patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: laravel-nginx
      $patch: delete

  # 6. Sumber daya diperkecil agar muat di laptop.
  - path: patch-resources-kecil.yaml

# --- jumlah replika ---------------------------------------------------------
# Satu Node berarti menambah replika tidak menambah ketahanan apa pun --
# hanya menghabiskan RAM laptop.
replicas:
  - name: laravel-fpm
    count: 1
  - name: laravel-nginx
    count: 1
  - name: laravel-queue
    count: 1
