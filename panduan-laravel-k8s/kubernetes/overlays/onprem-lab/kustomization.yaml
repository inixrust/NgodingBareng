# ============================================================================
# OVERLAY: On-Premise LAB (kubeadm, TANPA registry)
#
# Klaster: cp 192.168.50.14 · worker1-3 192.168.50.15-17 · Cilium CNI
#
# Perbedaan terhadap overlay "onprem" (produksi):
#   - Image TIDAK ditarik dari registry. Ia dimuat langsung ke containerd
#     setiap worker dengan `ctr images import` (lihat scripts/muat-image-onprem.sh
#     dan docs/11-deploy-onprem-lab.md). Karena itu:
#       * nama image tetap laravel-app/* dengan tag versi
#       * imagePullPolicy tetap IfNotPresent (bawaan base)
#       * tidak ada imagePullSecrets
#   - Sisanya SAMA dengan onprem: 3 replika tersebar paksa (DoNotSchedule),
#     HPA + PDB aktif, storage NFS + local-path.
#
# Deploy:
#   kubectl apply -k kubernetes/overlays/onprem-lab
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laravel

resources:
  - ../../base

# --- image ------------------------------------------------------------------
# Tag DIVERSIKAN (v1, v2, ...) walau tanpa registry — tag unik itulah yang
# membuat rollback bermakna. JANGAN memakai "latest": selain memicu pull ke
# Docker Hub, Anda kehilangan kemampuan menyebut "versi sebelumnya".
# Naikkan tag lewat:  kustomize edit set image laravel-app/php=laravel-app/php:v2
images:
  - name: laravel-app/php
    newTag: v1
  - name: laravel-app/nginx
    newTag: v1

patches:
  # 1. URL aplikasi — IP MetalLB milik ingress controller + nip.io.
  - target:
      kind: ConfigMap
      name: laravel-config
    patch: |-
      - op: replace
        path: /data/APP_URL
        value: http://laravel.192.168.50.200.nip.io

  - target:
      kind: Ingress
      name: laravel
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: laravel.192.168.50.200.nip.io

  # 2. StorageClass: unggahan butuh RWX -> NFS; database butuh IO cepat -> local-path.
  - target:
      kind: PersistentVolumeClaim
      name: laravel-storage
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-client

  - target:
      kind: StatefulSet
      name: mariadb
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path

  # 3. Penyebaran ketat: tiga worker tersedia, jadi DoNotSchedule aman dan
  #    memaksa replika tersebar — satu Node mati hanya kehilangan 1/3 kapasitas.
  - target:
      kind: Deployment
      name: laravel-fpm
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule

  - target:
      kind: Deployment
      name: laravel-nginx
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule

replicas:
  - name: laravel-fpm
    count: 3
  - name: laravel-nginx
    count: 3
  - name: laravel-queue
    count: 2
