# ============================================================================
# OVERLAY: On-Premise (kubeadm)
#
# Klaster:
#   control plane : 192.168.50.14
#   worker        : 192.168.50.15, .16, .17
#
# Deploy:
#   kubectl apply -k kubernetes/overlays/onprem
#
# Bandingkan berkas ini dengan overlays/docker-desktop: perbedaannya hanya
# StorageClass, host, registry, jumlah replika, dan beberapa kebijakan
# produksi. Tidak ada satu pun manifest yang diduplikasi.
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laravel

resources:
  - ../../base
  # PV statis untuk NFS TIDAK diperlukan bila memakai provisioner dinamis
  # (rekomendasi utama, lihat docs/07). Contoh PV manual disediakan di
  # infra/storage-local-pv.yaml bila Anda memilih Local Persistent Volume.

# --- registry ---------------------------------------------------------------
# Node kubeadm TIDAK berbagi daemon Docker dengan mesin Anda, jadi image
# WAJIB berada di registry yang bisa dijangkau ketiga worker.
#
# Tag di-set oleh pipeline CI:
#   kustomize edit set image laravel-app/php=ghcr.io/ORG/laravel-php:$SHA
# Jangan memakai "latest" di produksi: Anda kehilangan kemampuan rollback
# karena tidak ada cara menyebut "versi sebelumnya".
images:
  - name: laravel-app/php
    newName: ghcr.io/ORGANISASI/laravel-php
    newTag: v1.0.0
  - name: laravel-app/nginx
    newName: ghcr.io/ORGANISASI/laravel-nginx
    newTag: v1.0.0

patches:
  # 1. URL aplikasi.
  #    nip.io adalah layanan DNS wildcard: laravel.192.168.50.200.nip.io
  #    otomatis me-resolve ke 192.168.50.200. Ini menghilangkan kebutuhan
  #    menyiapkan DNS internal hanya untuk mencoba klaster.
  #    Untuk produksi sungguhan, ganti dengan domain milik Anda.
  - target:
      kind: ConfigMap
      name: laravel-config
    patch: |-
      - op: replace
        path: /data/APP_URL
        value: http://laravel.192.168.50.200.nip.io

  - target:
      kind: Ingress
      name: laravel
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: laravel.192.168.50.200.nip.io

  # 2. StorageClass NFS.
  #    "nfs-client" adalah nama default yang dibuat nfs-subdir-external-
  #    provisioner. Sesuaikan bila Anda memakai nama lain.
  #
  #    Kenapa NFS dan bukan Local PV? Karena PVC laravel-storage butuh
  #    ReadWriteMany: Pod php-fpm, nginx, dan queue tersebar di tiga worker
  #    dan harus melihat berkas unggahan yang sama. Local PV hanya mendukung
  #    ReadWriteOnce dan mengunci Pod ke satu Node. Pembahasan lengkap ada di
  #    docs/07-persistent-storage.md.
  - target:
      kind: PersistentVolumeClaim
      name: laravel-storage
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: nfs-client

  # Database memakai StorageClass BERBEDA dari berkas unggahan.
  #   - laravel-storage -> nfs-client (butuh RWX, IO ringan)
  #   - data-mariadb-0  -> local-path (butuh IO cepat, cukup RWO)
  # Menjalankan InnoDB di atas NFS bisa dilakukan, tetapi latensi fsync-nya
  # membuat kinerja tulis anjlok. Database sebaiknya di disk lokal Node.
  - target:
      kind: StatefulSet
      name: mariadb
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi

  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path

  # 3. Kebijakan produksi tambahan
  - path: patch-produksi.yaml

# --- jumlah replika ---------------------------------------------------------
# Tiga worker -> tiga replika, satu per Node berkat topologySpreadConstraints
# di base. Satu worker mati, dua lainnya tetap melayani.
replicas:
  - name: laravel-fpm
    count: 3
  - name: laravel-nginx
    count: 3
  - name: laravel-queue
    count: 2
