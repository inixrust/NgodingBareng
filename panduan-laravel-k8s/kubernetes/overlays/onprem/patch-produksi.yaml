# Kebijakan yang hanya berlaku di klaster on-premise.

# --- 1. imagePullPolicy dan imagePullSecrets -------------------------------
# Always dipilih SECARA SENGAJA di produksi meski tag-nya sudah unik:
# ia menjamin Node yang kebetulan menyimpan image dengan tag sama (mis. dari
# build sebelumnya yang gagal, atau tag yang tanpa sengaja di-push ulang)
# tetap menarik versi yang benar dari registry.
#
# imagePullSecrets dibutuhkan untuk registry privat. Buat lebih dulu:
#   kubectl -n laravel create secret docker-registry ghcr-creds \
#     --docker-server=ghcr.io \
#     --docker-username=<user> \
#     --docker-password=<token-dengan-scope-read:packages>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-fpm
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: php-fpm
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-nginx
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: nginx
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-queue
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: queue
          imagePullPolicy: Always
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: laravel-scheduler
spec:
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
            - name: ghcr-creds
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-creds
---
# --- 2. Penyebaran ketat antar Node ----------------------------------------
# Di klaster tiga worker, DoNotSchedule sekarang aman dan bermanfaat:
# ia MEMAKSA replika tersebar. Dengan ScheduleAnyway (nilai base), scheduler
# boleh menumpuk dua replika di satu Node bila kebetulan itu yang paling
# lapang -- dan Node itu mati berarti dua pertiga kapasitas ikut hilang.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-fpm
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: laravel-fpm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-nginx
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: laravel-nginx
