# Job verifikasi dalam-Pod — dipakai verify.sh sebagai FALLBACK ketika
# `kubectl exec` tidak berfungsi (kasus nyata: bug streaming CRI pada
# Docker Desktop tertentu, gejala: "http: server gave HTTP response to
# HTTPS client"; `kubectl logs` tetap sehat).
#
# Job memakai image + ConfigMap/Secret yang sama dengan Pod aplikasi,
# mencetak PENANDA per pemeriksaan, lalu verify.sh membaca lognya.
apiVersion: batch/v1
kind: Job
metadata:
  name: uji-dalam
  namespace: laravel
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: laravel
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: uji
          image: laravel-app/php:dev   # verify.sh menimpanya dengan image fpm aktif
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              tanda() { "$@" >/dev/null 2>&1 && echo "TANDA-$NAMA=OK" || echo "TANDA-$NAMA=GAGAL"; }
              NAMA=TULIS-STORAGE  tanda sh -c 'touch storage/app/public/.uji && rm storage/app/public/.uji'
              NAMA=TULIS-BOOTSTRAP tanda sh -c 'touch bootstrap/cache/.uji && rm bootstrap/cache/.uji'
              NAMA=DATABASE       tanda php artisan db:show
              NAMA=MIGRASI        sh -c 'php artisan migrate:status 2>/dev/null | grep -q Ran \
                                         && echo TANDA-MIGRASI=OK || echo TANDA-MIGRASI=GAGAL'
              NAMA=REDIS          tanda php -r '$r=new Redis(); $r->connect(getenv("REDIS_HOST"),6379); $r->ping();'
              NAMA=CACHE          sh -c 'php artisan tinker --execute \
                                         "cache()->put(\"uji\",\"OK\",10); echo cache()->get(\"uji\");" \
                                         2>/dev/null | grep -q OK \
                                         && echo TANDA-CACHE=OK || echo TANDA-CACHE=GAGAL'
              NAMA=ROOTFS-RO      sh -c 'touch /uji 2>/dev/null \
                                         && echo TANDA-ROOTFS-RO=GAGAL || echo TANDA-ROOTFS-RO=OK'
              echo "TANDA-SELESAI=OK"
          env:
            - { name: HOME, value: /tmp }
            - { name: SKIP_OPTIMIZE, value: "true" }
          envFrom:
            - configMapRef: { name: laravel-config }
            - secretRef:    { name: laravel-secret }
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "1000m", memory: "384Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: storage-app, mountPath: /var/www/html/storage/app/public }
            - { name: storage-framework, mountPath: /var/www/html/storage/framework }
            - { name: bootstrap-cache, mountPath: /var/www/html/bootstrap/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: storage-app
          persistentVolumeClaim: { claimName: laravel-storage }
        - { name: storage-framework, emptyDir: {} }
        - { name: bootstrap-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
